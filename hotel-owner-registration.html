<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Owner Registration - PointzNest</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #e67e22;
            --accent: #3498db;
            --light: #ecf0f1;
            --dark: #2c3e50;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
        }

        header {
            background-color: var(--primary);
            color: white;
            padding: 1rem 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            display: flex;
            align-items: center;
        }

        .logo i {
            margin-right: 10px;
            color: var(--secondary);
            animation: sparkle 2s infinite;
        }

        @keyframes sparkle {
            0% {
                text-shadow: 0 0 5px rgba(230, 126, 34, 0.5);
                transform: scale(1);
            }

            50% {
                text-shadow: 0 0 20px rgba(230, 126, 34, 0.9), 0 0 30px rgba(255, 255, 255, 0.8);
                transform: scale(1.1);
            }

            100% {
                text-shadow: 0 0 5px rgba(230, 126, 34, 0.5);
                transform: scale(1);
            }
        }

        nav {
            flex: 1;
            display: flex;
            justify-content: center;
        }

        nav ul {
            display: flex;
            list-style: none;
        }

        nav ul li {
            margin-left: 1.5rem;
            display: flex;
            align-items: center;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            transition: color 0.3s;
            display: flex;
            align-items: center;
            font-weight: 500;
            font-size: 1.1rem;
        }

        nav ul li a i {
            margin-right: 10px;
            font-size: 1.3rem;
        }

        nav ul li a:hover {
            color: var(--secondary);
        }

        .user-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .btn {
            padding: 0.7rem 1.5rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .btn i {
            margin-right: 8px;
        }

        .btn-primary {
            background-color: var(--secondary);
            color: white;
        }

        .btn-primary:hover {
            background-color: #d35400;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .btn-outline {
            background-color: transparent;
            border: 2px solid white;
            color: white;
        }

        .btn-outline:hover {
            background-color: white;
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .registration-section {
            background: linear-gradient(rgba(44, 62, 80, 0.85), rgba(44, 62, 80, 0.85)), url('https://images.unsplash.com/photo-1514933651103-005eec06c04b?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
            color: white;
            padding: 4rem 0;
            text-align: center;
            flex-grow: 1;
            display: flex;
            align-items: center;
        }

        .registration-container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 2.5rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .registration-container h2 {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            color: white;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.9);
            color: #333 !important;
        }

        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: 2px solid var(--secondary);
        }

        .form-row {
            display: flex;
            gap: 1rem;
        }

        .form-col {
            flex: 1;
        }

        .form-footer {
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .form-footer .btn {
            width: 100%;
            padding: 1rem;
            font-size: 1.1rem;
        }

        .login-link {
            margin-top: 1.5rem;
            color: #ddd;
            font-size: 1.1rem;
        }

        .login-link a {
            color: var(--secondary);
            text-decoration: none;
            font-weight: 500;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        footer {
            background-color: var(--dark);
            color: white;
            padding: 2rem 0 1rem;
            text-align: center;
        }

        .footer-content {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .footer-section {
            flex: 1;
            min-width: 250px;
            margin-bottom: 1.5rem;
        }

        .footer-section h3 {
            margin-bottom: 1rem;
            color: var(--secondary);
            font-size: 1.2rem;
        }

        .footer-section ul {
            list-style: none;
        }

        .footer-section ul li {
            margin-bottom: 0.5rem;
        }

        .footer-section a {
            color: #ddd;
            text-decoration: none;
            transition: color 0.3s;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .footer-section a i {
            margin-right: 8px;
        }

        .footer-section a:hover {
            color: var(--secondary);
        }

        .legal-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin: 1rem 0;
            flex-wrap: wrap;
        }

        .legal-links a {
            color: #ddd;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .legal-links a:hover {
            color: var(--secondary);
        }

        .copyright {
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                text-align: center;
            }

            nav ul {
                margin-top: 1rem;
                justify-content: center;
            }

            .user-actions {
                margin-top: 1rem;
                flex-direction: column;
                width: 100%;
            }

            .user-actions .btn {
                width: 100%;
                margin: 0.3rem 0;
            }

            .registration-container {
                padding: 2rem 1.5rem;
            }

            .form-row {
                flex-direction: column;
                gap: 0;
            }

            .footer-content {
                flex-direction: column;
            }

            .legal-links {
                flex-direction: column;
                gap: 0.5rem;
            }

            .footer-section a {
                justify-content: flex-start;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="container header-content">
            <div class="logo">
                <i class="fas fa-star"></i>
                <span>PointzNest</span>
            </div>
            <nav>
                <ul>
                    <li><a href="#"><i class="fas fa-user-plus"></i> Hotel Owner Registration</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="registration-section">
        <div class="container">
            <div class="registration-container">
                <h2>Register Your Hotel/Restaurant</h2>
                <form id="hotel-registration-form">
                    <div class="form-row">
                        <div class="form-col">
                            <div class="form-group">
                                <label for="fullName">Full Name *</label>
                                <input type="text" id="fullName" name="fullName" required placeholder="Your full name">
                            </div>
                        </div>
                        <div class="form-col">
                            <div class="form-group">
                                <label for="age">Age *</label>
                                <input type="number" id="age" name="age" min="18" max="100" required
                                    placeholder="Your age">
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="gender">Gender *</label>
                        <select id="gender" name="gender" required>
                            <option value="">Select Gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                            <option value="prefer-not-to-say">Prefer not to say</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="hotelType">Type of Establishment *</label>
                        <select id="hotelType" name="hotelType" required>
                            <option value="">Select Type</option>
                            <option value="fine-dining">Fine Dining Restaurant</option>
                            <option value="casual-dining">Casual Dining Restaurant</option>
                            <option value="fast-food">Fast Food Restaurant</option>
                            <option value="cafe">Cafe</option>
                            <option value="pub">Pub/Bar</option>
                            <option value="food-truck">Food Truck</option>
                            <option value="hotel-restaurant">Hotel Restaurant</option>
                            <option value="resort">Resort</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-col">
                            <div class="form-group">
                                <label for="email">Email Address *</label>
                                <input type="email" id="email" name="email" required placeholder="Your email address">
                            </div>
                        </div>
                        <div class="form-col">
                            <div class="form-group">
                                <label for="phone">Phone Number *</label>
                                <input type="tel" id="phone" name="phone" required placeholder="Your phone number">
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="hotelName">Hotel/Restaurant Name *</label>
                        <input type="text" id="hotelName" name="hotelName" required
                            placeholder="Your establishment name">
                    </div>

                    <div class="form-group">
                        <label for="address">Full Address *</label>
                        <textarea id="address" name="address" required
                            placeholder="Complete address of your establishment"></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-col">
                            <div class="form-group">
                                <label for="password">Password *</label>
                                <input type="password" id="password" name="password" required
                                    placeholder="Create a password">
                            </div>
                        </div>
                        <div class="form-col">
                            <div class="form-group">
                                <label for="confirmPassword">Confirm Password *</label>
                                <input type="password" id="confirmPassword" name="confirmPassword" required
                                    placeholder="Confirm your password">
                            </div>
                        </div>
                    </div>

                    <div class="form-footer">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-building"></i> Register Hotel
                        </button>
                    </div>

                    <div class="login-link">
                        Already have an account? <a href="hotel-owner-login.html">Sign In</a>
                    </div>
                </form>
            </div>
        </div>
    </section>


    <script>
        document.getElementById('hotel-registration-form').addEventListener('submit', function (e) {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                alert('Passwords do not match!');
                return;
            }

            if (password.length < 6) {
                alert('Password must be at least 6 characters long!');
                return;
            }

            // In a real application, you would submit the form to your server here
            alert('Registration successful! Your account is pending verification.');
            // Redirect to login page
            setTimeout(() => {
                window.location.href = 'hotel-owner-login.html';
            }, 2000);
        });
    </script>
</body>

</html>
