<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PointzNest - Customer Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #e67e22;
            --accent: #3498db;
            --light: #ecf0f1;
            --dark: #2c3e50;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1200极;
            margin: 0 auto;
            padding: 0 15px;
        }

        header {
            background-color: var(--primary);
            color: white;
            padding: 1rem 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            display: flex;
            align-items: center;
        }

        .logo i {
            margin-right: 10px;
            color: var(--secondary);
            animation: sparkle 2s infinite;
        }

        @keyframes sparkle {
            0% {
                text-shadow: 0 0 5px rgba(230, 126, 34, 0.5);
                transform: scale(1);
            }

            50% {
                text-shadow: 0 0 20px rgba(230, 126, 34, 0.9), 0 0 30px rgba(255, 255, 255, 0.8);
                transform: scale(1.1);
            }

            100% {
                text-shadow: 0 极 5px rgba(230, 126, 34, 0.5);
                transform: scale(1);
            }
        }

        nav {
            flex: 1;
            display: flex;
            justify-content: center;
        }

        nav ul {
            display: flex;
            list-style: none;
        }

        nav ul li {
            margin-left: 1.5rem;
            display: flex;
            align-items: center;
        }

        nav ul li a {
            color: black;
            text-decoration: none;
            transition: color 0.3s;
            display: flex;
            align-items: center;
            font-weight: 500;
            font-size: 1.1rem;
        }

        nav ul li a i {
            margin-right: 10px;
            font-size: 1.3rem;
        }

        nav ul li a:hover {
            color: var(--secondary);
        }

        .user-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .btn {
            padding: 0.7rem 1.5rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .btn i {
            margin-right: 8px;
        }

        .btn-primary {
            background-color: var(--secondary);
            color: white;
        }

        .btn-primary:hover {
            background-color: #d35400;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .btn-outline {
            background-color: transparent;
            border: 2px solid white;
            color: white;
        }

        .btn-outline:hover {
            background-color: white;
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .login-section {
            background: linear-gradient(rgba(44, 62, 80, 0.85), rgba(44, 62, 80, 0.85)), url('https://images.unsplash.com/photo-1504754524776-8f4f37790ca0?auto=format&fit=crop&w=1400&q=80');
            background-size: cover;
            background-position: center;
            color: white;
            padding: 4rem 0;
            text-align: center;
            flex-grow: 1;
            display: flex;
            align-items: center;
        }

        .login-container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 2.5rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .login-container h2 {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            color: white;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.9);
            color: #333 !important;
        }

        .form-group input:focus {
            outline: 2px solid var(--secondary);
        }

        .form-footer {
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .form-footer .btn {
            width: 100%;
            padding: 1rem;
            font-size: 1.1rem;
        }

        .registration-link {
            margin-top: 1.5rem;
            color: #ddd;
            font-size: 1.1rem;
        }

        .registration-link a {
            color: var(--secondary);
            text-decoration: none;
            font-weight: 500;
        }

        .registration-link a:hover {
            text-decoration: underline;
        }

        .forgot-password {
            margin-top: 0.5rem;
            text-align: right;
        }

        .forgot-password a {
            color: #ddd;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .forgot-password a:hover {
            color: var(--secondary);
            text-decoration: underline;
        }

        footer {
            background-color: var(--dark);
            color: white;
            padding: 2rem 0 1rem;
            text-align: center;
        }

        .footer-content {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .footer-section {
            flex: 1;
            min-width: 250px;
            margin-bottom: 1.5rem;
        }

        .footer-section h3 {
            margin-bottom: 1rem;
            color: var(--secondary);
            font-size: 1.2rem;
        }

        .footer-section ul {
            list-style: none;
        }

        .footer-section ul li {
            margin-bottom: 0.5rem;
        }

        .footer-section a {
            color: #ddd;
            text-decoration: none;
            transition: color 0.3s;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .footer-section a i {
            margin-right: 8px;
        }

        .footer-section a:hover {
            color: var(--secondary);
        }

        .legal-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin: 1rem 0;
            flex-wrap: wrap;
        }

        .legal-links a {
            color: #ddd;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .legal-links极a:hover {
            color: var(--secondary);
        }

        .copyright {
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                text-align: center;
            }

            nav ul {
                margin-top: 1rem;
                justify-content: center;
            }

            .user-actions {
                margin-top: 1rem;
                flex-direction: column;
                width: 100%;
            }

            .user-actions .btn {
                width: 100%;
                margin: 0.3rem 0;
            }

            .login-container {
                padding: 2rem 1.5rem;
            }

            .footer-content {
                flex-direction: column;
            }

            .legal-links {
                flex-direction: column;
                gap: 0.5rem;
            }

            .footer-section a {
                justify-content: flex-start;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="container header-content">
            <div class="logo">
                <i class="fas fa-star"></i>
                <span>PointzNest</span>
            </div>
            <nav>
                <ul>
                    <li><a href="customer-login.html"><i class="fas fa-sign-in-alt"></i> Login</a></li>

                </ul>
            </nav>
        </div>
        </div>
    </header>

    <section class="login-section">
        <div class="container">
            <div class="login-container">
                <h2>Customer Login</h2>
                <form id="login-form">
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" required placeholder="Enter your phone number">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required placeholder="Enter your password">
                    </div>



                    <div class="form-footer">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-sign-in-alt"></i> Login
                        </button>
                    </div>

                    <div class="registration-link">
                        Don't have an account? <a href="customer-registration.html">Register here</a>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <script>
        document.getElementById('login-form').addEventListener('submit', function (e) {
            e.preventDefault();

            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;

            if (!phone || !password) {
                alert('Please fill in all fields');
                return;
            }

            // In a real application, you would authenticate with your server here
            // For demo purposes, we'll simulate a successful login
            alert('Login successful! Redirecting to your dashboard...');
            window.location.href = 'customer-dashboard.html'; // You'll need to create this page
        });
    </script>
</body>

</html>
