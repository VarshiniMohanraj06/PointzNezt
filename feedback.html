<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PointzNest - Feedback & Rating</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #e67e22;
            --accent: #3498db;
            --light: #ecf极0f1;
            --dark: #2c3e50;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
        }

        header {
            background-color: var(--primary);
            color: white;
            padding: 1rem 0;
            box-shadow: 0 2极 5px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            display: flex;
            align-items: center;
        }

        .logo i {
            margin-right: 10px;
            color: var(--secondary);
            animation: sparkle 2s infinite;
        }

        @keyframes sparkle {
            0% {
                text-shadow: 0 0 5px rgba(230, 126, 34, 0.5);
                transform: scale(1);
            }

            50% {
                text-shadow: 0 0 20px rgba(230, 126, 34, 0.9), 0 0 30px rgba(255, 255, 255, 0.8);
                transform: scale(1.1);
            }

            100% {
                text-shadow: 0 0 5px rgba(230, 126, 34, 0.5);
                transform: scale(1);
            }
        }

        nav {
            flex: 1;
            display: flex;
            justify-content: center;
        }

        nav ul {
            display: flex;
            list-style: none;
        }

        nav ul li {
            margin-left: 1.5rem;
            display: flex;
            align-items: center;
        }

        nav ul极 a {
            color: white;
            text-decoration: none;
            transition: color 0.3s;
            display: flex;
            align-items: center;
            font-weight: 500;
            font-size: 1.1rem;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            /* Remove underline */
            transition: color 0.3s;
            display: flex;
            align-items: center;
            font-weight: 500;
            font-size: 1.1rem;
        }

        nav ul li a:hover {
            color: #e67e22;
            text-decoration: none;
            /* Ensure no underline on hover too */
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-welcome {
            display: flex;
            align-items: center;
        }

        .user-welcome i {
            margin-right: 8px;
            color: var(--secondary);
        }

        .btn {
            padding: 0.7rem 1.5rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1极rem;
        }

        .btn i {
            margin-right: 8px;
        }

        .btn-primary {
            background-color: var(--secondary);
            color: white;
        }

        .btn-primary:hover {
            background-color: #d35400;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .btn-outline {
            background-color: transparent;
            border: 2px solid white;
            color: white;
        }

        .btn-outline:hover {
            background-color: white;
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .feedback-section {
            background: linear-gradient(rgba(44, 62, 80, 0.85), rgba(44, 62, 80, 0.85)), url('https://images.unsplash.com/photo-1414235077428-338989a2e8c0?ixlib=rb-4.0.3&ixid=M3wxMj极3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx极fA%3D%3D&auto=format&极fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
            color: white;
            padding: 2rem 0;
            text-align: center;
            flex-grow: 1;
        }

        .feedback-container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 2.5rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .feedback-container h2 {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            color: white;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.9);
            color: #333 !important;
        }

        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: 2px solid var(--secondary);
        }

        .rating-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .rating-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .rating-stars {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .star {
            font-size: 2rem;
            color: #ddd;
            cursor: pointer;
            transition: color 0.2s, transform 0.2s;
        }

        .star:hover,
        .star.active {
            color: var(--secondary);
            transform: scale(1.1);
        }

        .rating-text {
            font-size: 0.9rem;
            color: #ddd;
            font-style: italic;
        }

        .form-footer {
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .form-footer .btn {
            width: 100%;
            padding: 1rem;
            font-size: 1.1rem;
        }

        footer {
            background-color: var(--dark);
            color: white;
            padding: 2rem 0 1rem;
            text-align: center;
        }

        .footer-content {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .footer-section {
            flex: 1;
            min-width: 250px;
            margin-bottom: 1.5rem;
        }

        .footer-section h3 {
            margin-bottom: 1rem;
            color: var(--secondary);
            font-size: 1.2rem;
        }

        .footer-section ul {
            list-style: none;
        }

        .footer-section ul li {
            margin-bottom: 0.5rem;
        }

        .footer-section a {
            color: #ddd;
            text-decoration: none;
            transition: color 0.3s;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .footer-section a i {
            margin-right: 8px;
        }

        .footer-section a:hover {
            color: var(--secondary);
        }

        .legal-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin: 1rem 0;
            flex-wrap: wrap;
        }

        .legal极links a {
            color: #ddd;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .legal-links a:hover {
            color: var(--secondary);
        }

        .copyright {
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                text-align: center;
            }

            nav ul {
                margin-top: 1rem;
                justify-content: center;
            }

            .user-info {
                margin-top: 1rem;
                flex-direction: column;
                width: 100%;
            }

            .feedback-container {
                padding: 2rem 1.5rem;
            }

            .footer-content {
                flex-direction: column;
            }

            .legal-links {
                flex-direction: column;
                gap: 0.5rem;
            }

            .footer-section a {
                justify-content: flex-start;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="container header-content">
            <div class="logo">
                <i class="fas fa-star"></i>
                <span>PointzNest</span>
            </div>
            <nav>
                <nav>
                    <ul>
                        <li><a href="feedback.html" style="text-decoration: none;"><i
                                    class="fas fa-comment"></i>Feedback</a></li>
                    </ul>
                </nav>
                <div class="user-info">
                    <button class="btn btn-outline" onclick="window.location.href='index.html'">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </div>
        </div>
    </header>

    <section class="feedback-section">
        <div class="container">
            <div class="feedback-container">
                <h2>Share Your Feedback</h2>
                <form id="feedback-form">
                    <div class="form-group">
                        <label for="hotel">Select Hotel/Restaurant</label>
                        <select id="hotel" name="hotel" required>
                            <option value="">Select a hotel or restaurant</option>
                            <option value="seaside">Seaside Resort</option>
                            <option value="urban">Urban Loft Hotel</option>
                            <option value="mountain">Mountain Retreat</option>
                            <option value="grand">Grand Plaza Hotel</option>
                        </select>
                    </div>

                    <div class="rating-group">
                        <label for="rating">Overall Rating</label>
                        <div class="rating-stars">
                            <span class="star" data-value="1"><i class="fas fa-star"></i></span>
                            <span class="star" data-value="2"><i class="fas fa-star"></i></span>
                            <span class="star" data-value="3"><i class="fas fa-star"></i></span>
                            <span class="star" data-value="4"><i class="fas fa-star"></i></span>
                            <span class="star" data-value="5"><i class="fas fa-star"></i></span>
                        </div>
                        <div class="rating-text" id="rating-text">Please select a rating</div>
                        <input type="hidden" id="rating" name="rating" required>
                    </div>

                    <div class="form-group">
                        <label for="comments">Your Feedback</label>
                        <textarea id="comments" name="comments" required
                            placeholder="Please share your experience..."></textarea>
                    </div>

                    <div class="form-footer">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-paper-plane"></i> Submit Feedback
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <script>
        // Star rating functionality
        const stars = document.querySelectorAll('.star');
        const ratingInput = document.getElementById('rating');
        const ratingText = document.getElementById('rating-text');

        const ratingTexts = {
            1: "Poor - Very dissatisfied",
            2: "Fair - Somewhat dissatisfied",
            3: "Good - Satisfied",
            4: "Very Good - Very satisfied",
            5: "Excellent - Extremely satisfied"
        };

        let currentRating = 0;

        stars.forEach(star => {
            star.addEventListener('click', () => {
                const value = parseInt(star.getAttribute('data-value'));
                currentRating = value;
                ratingInput.value = value;

                // Update ALL stars up to the selected rating
                stars.forEach(s => {
                    const starValue = parseInt(s.getAttribute('data-value'));
                    if (starValue <= value) {
                        s.classList.add('active');
                        s.style.color = '#e67e22';
                    } else {
                        s.classList.remove('active');
                        s.style.color = '#ddd';
                    }
                });

                // Update rating text
                ratingText.textContent = ratingTexts[value];
            });

            star.addEventListener('mouseover', () => {
                const value = parseInt(star.getAttribute('data-value'));

                // Preview star selection on hover
                stars.forEach(s => {
                    const starValue = parseInt(s.getAttribute('data-value'));
                    if (starValue <= value) {
                        s.style.color = '#e67e22';
                    } else {
                        s.style.color = '#ddd';
                    }
                });
            });

            star.addEventListener('mouseout', () => {
                // Restore star selection based on actual rating when mouse leaves
                stars.forEach(s => {
                    const starValue = parseInt(s.getAttribute('data-value'));
                    if (starValue <= currentRating) {
                        s.style.color = '#e67e22';
                    } else {
                        s.style.color = '#ddd';
                    }
                });
            });
        });

        // Form submission
        document.getElementById('feedback-form').addEventListener('submit', function (e) {
            e.preventDefault();

            const rating = document.getElementById('rating').value;
            const hotel = document.getElementById('hotel').value;

            if (!rating) {
                alert('Please select a rating');
                return;
            }

            if (!hotel) {
                alert('Please select a hotel or restaurant');
                return;
            }

            // In a real application, you would submit the form to your server here
            alert('Thank you for your feedback! You earned 50 points.');
        });
    </script>
</body>

</html>
